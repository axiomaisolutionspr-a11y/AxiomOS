version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "security(deps)"
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - "*"
