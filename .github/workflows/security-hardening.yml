name: AxiomOS security hardening QA

on:
  push:
    branches:
      - security/crm-webhooks-hardening-20261103
  pull_request:
    paths:
      - app/lib/crm/security.ts
      - app/lib/webhook-auth.ts
      - app/lib/limited-request-body.ts
      - app/api/crm-auth/route.ts
      - app/api/whatsapp/route.ts
      - app/api/telnyx/route.ts
      - app/prospectos/simple/actions.ts
      - app/prospectos/simple/calls.ts
      - proxy.ts
      - db/migrations/20261103_crm_sessions.sql
      - tests/security-hardening.test.cjs
      - tests/http-negative-e2e.mjs
      - .github/workflows/security-hardening.yml

permissions:
  contents: read
jobs:
  security-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit production dependencies and block high/critical advisories
        run: npm audit --omit=dev --audit-level=high
      - run: node --test tests/security-hardening.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AXIOMOS_CRM_SESSION_V2_ENABLED: "false"
          AXIOMOS_TELNYX_SIGNATURE_REQUIRED: "false"
          AXIOMOS_WHATSAPP_WEBHOOK_AUTH_MODE: "off"
      - run: node tests/http-negative-e2e.mjs
        env:
          DATABASE_URL: ""
          DATABASE_URL_UNPOOLED: ""
          AXIOMOS_CRM_RATE_LIMIT_SECRET: ""
          TELNYX_API_KEY: ""
          WHATSAPP_ACCESS_TOKEN: ""
          DUALHOOK_API_KEY: ""

  dependency-remediation:
    if: github.ref == 'refs/heads/security/crm-webhooks-hardening-20261103'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply tested compatible Next.js patch and non-forced audit fixes
        run: |
          npm ci --no-audit --no-fund
          npm install next@16.4.5 --save-exact --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Mandatory production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: node --test tests/security-hardening.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node tests/http-negative-e2e.mjs
        env:
          DATABASE_URL: ""
          DATABASE_URL_UNPOOLED: ""
          AXIOMOS_CRM_RATE_LIMIT_SECRET: ""
          TELNYX_API_KEY: ""
          WHATSAPP_ACCESS_TOKEN: ""
          DUALHOOK_API_KEY: ""
      - name: Commit verified lockfile only to QA branch
        run: |
          git config user.name "axiomos-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(deps): Next.js patch and compatible audited lockfile"
            git push origin HEAD:security/crm-webhooks-hardening-20261103
          fi
