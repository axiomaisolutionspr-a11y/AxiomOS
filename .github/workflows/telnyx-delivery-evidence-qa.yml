name: Telnyx SMS delivery evidence (read-only QA)

on:
  push:
    branches:
      - fix/telnyx-delivery-readonly-cert-20261112
  pull_request:
    branches:
      - main
    paths:
      - "app/lib/telnyx-cert-evidence.ts"
      - "app/prospectos/autopilot/seguimientos/prueba-sms/evidencia/page.tsx"
      - "app/prospectos/autopilot/seguimientos/prueba-sms/diagnostico/page.tsx"
      - "tests/telnyx-cert-evidence.test.mjs"
      - ".github/workflows/telnyx-delivery-evidence-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    name: Read-only SMS status checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies (no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Status classification tests (no provider calls)
        run: node --test tests/telnyx-cert-evidence.test.mjs
      - name: Generate Next.js types
        run: npx next typegen
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint production changes
        run: npx eslint app/lib/telnyx-cert-evidence.ts app/prospectos/autopilot/seguimientos/prueba-sms/evidencia/page.tsx app/prospectos/autopilot/seguimientos/prueba-sms/diagnostico/page.tsx
      - name: Patch integrity
        run: git diff --check origin/main...HEAD
