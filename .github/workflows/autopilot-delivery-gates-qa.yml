name: AxiomOS Autopilot QA dispatch policy
on:
  pull_request:
    paths:
      - 'app/lib/autopilot-delivery-gates.mjs'
      - 'tests/autopilot-delivery-gates.test.mjs'
      - 'app/lib/autopilot-provider-bridge.mjs'
      - 'tests/autopilot-provider-bridge.test.mjs'
      - 'app/api/whatsapp/route.ts'
      - 'tests/whatsapp-signature-route.test.mjs'
      - '.github/workflows/autopilot-delivery-gates-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fail-closed QA policy (NO SEND)
        run: node --test tests/autopilot-delivery-gates.test.mjs tests/autopilot-provider-bridge.test.mjs
