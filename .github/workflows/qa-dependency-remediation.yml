name: QA dependency remediation
on:
  push:
    branches:
      - security/crm-webhooks-hardening-20261103
    paths:
      - .github/workflows/qa-dependency-remediation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-and-verify:
    if: github.ref == 'refs/heads/security/crm-webhooks-hardening-20261103'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply tested compatible Next.js patch and non-forced audit fixes
        run: |
          npm ci --no-audit --no-fund
          npm install next@16.4.5 --save-exact --no-audit --no-fund
          npm audit fix --no-fund || true
      - name: Mandatory production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: node --test tests/security-hardening.test.cjs
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node tests/http-negative-e2e.mjs
        env:
          DATABASE_URL: ""
          DATABASE_URL_UNPOOLED: ""
          AXIOMOS_CRM_RATE_LIMIT_SECRET: ""
          TELNYX_API_KEY: ""
          WHATSAPP_ACCESS_TOKEN: ""
          DUALHOOK_API_KEY: ""
      - name: Commit verified lockfile only to QA branch
        run: |
          git config user.name "axiomos-qa-bot"
          git config user.email "qa-bot@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security(deps): Next.js patch and compatible audited lockfile"
            git push origin HEAD:security/crm-webhooks-hardening-20261103
          fi
