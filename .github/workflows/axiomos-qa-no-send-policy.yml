name: AxiomOS isolated QA policy (NO SEND)
on:
  pull_request:
    paths:
      - 'app/lib/autopilot-delivery-gates.mjs'
      - 'tests/autopilot-delivery-gates.test.mjs'
      - '.github/workflows/axiomos-qa-no-send-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa-policy-no-send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify static QA policy (no network and no providers)
        run: node --test tests/autopilot-delivery-gates.test.mjs
