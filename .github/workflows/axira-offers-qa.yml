name: Axira offers isolated QA
on:
  pull_request:
    paths:
      - 'app/api/brain/route.ts'
      - 'app/lib/axira-offers-*'
      - 'app/lib/crm/model.ts'
      - 'database/migrations/20261106_axira_offers.sql'
      - 'proxy.ts'
      - 'package*.json'
      - 'app/prospectos/ofertas/**'
      - 'app/prospectos/simple/page.tsx'
      - 'app/prospectos/simple/CRMWorkspace.tsx'
      - 'tests/axira-offers-*'
      - 'tests/crm-priority.test.mjs'
      - 'tests/fixtures/axira-offers-*'
      - '.github/workflows/axira-offers-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Test offer rules and existing reply policy
        run: node --experimental-strip-types --test tests/axira-offers-policy.test.mjs tests/axira-offers-database.test.mjs tests/axira-reply-policy.test.mjs tests/crm-priority.test.mjs
      - name: Generate Next.js 16 route and layout types
        run: npx next typegen
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Check production build
        run: npm run build

      - name: Verify catalog through HTTP forms and Brain
        run: node --test tests/axira-offers-http.test.mjs
