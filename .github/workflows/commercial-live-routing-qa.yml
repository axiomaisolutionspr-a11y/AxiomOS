name: Commercial live-Neon routing QA (no secrets)

on:
  push:
    branches:
      - fix/commercial-live-neon-routing-qa-20261112
  pull_request:
    branches:
      - main
    paths:
      - "app/lib/commercial-identity.ts"
      - "app/lib/whatsapp-manual-opt-out-mode.mjs"
      - "tests/commercial-identity.test.mjs"
      - "tests/whatsapp-manual-opt-out.test.mjs"
      - ".github/workflows/commercial-live-routing-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commercial-live-routing-qa
  cancel-in-progress: false

jobs:
  isolated:
    name: No-secret isolated tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commercial identity + opt-out tests (PGlite local only)
        run: node --test tests/commercial-identity.test.mjs tests/whatsapp-manual-opt-out.test.mjs
      - name: Generate Next.js route and layout types
        run: npx next typegen
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Lint modified production code
        run: npx eslint app/lib/commercial-identity.ts app/lib/whatsapp-manual-opt-out-mode.mjs
      - name: Whitespace and patch validation
        run: git diff --check origin/main...HEAD
